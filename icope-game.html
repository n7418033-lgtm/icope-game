<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咱後世人 . 六力登機證</title>
<style>
  :root{
    --green-50:#EAF3DE; --green-100:#C0DD97; --green-200:#97C459; --green-600:#3B6D11; --green-800:#27500A;
    --amber-50:#FAEEDA; --amber-200:#EF9F27; --amber-600:#854F0B; --amber-800:#633806;
    --cream:#FBF8F1; --card:#FFFFFF; --ink:#2C2C2A; --ink-soft:#5F5E5A; --ink-muted:#888780; --border:#E4E0D4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.7;}
  .screen{max-width:520px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;}
  .card{background:var(--card);border-radius:20px;padding:26px 22px;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
  small{font-size:11px;color:var(--ink-muted);letter-spacing:.06em;display:block;}
  button{font-family:inherit;cursor:pointer;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:15px;padding:14px 16px;}
  .btn-primary{width:100%;background:var(--green-600);color:#fff;border:none;font-weight:500;padding:16px;}
  .btn-primary:active{background:var(--green-800);}
  .btn-link{background:none;border:none;color:var(--ink-muted);font-size:12px;text-decoration:underline;padding:10px;width:100%;}
  .btn-back{background:none;border:none;color:var(--green-600);padding:0 0 14px;font-size:14px;}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--green-50);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .avatar img,.portrait img{width:100%;height:100%;object-fit:cover;}
  .portrait{width:110px;height:110px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:var(--green-50);display:flex;align-items:center;justify-content:center;}
  .hello{display:flex;gap:12px;align-items:center;margin-bottom:16px;}
  .hello p{margin:0;font-size:14px;color:var(--ink-soft);}
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  input.text{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;font-size:18px;font-family:inherit;margin-bottom:8px;}
  .note{font-size:12px;color:var(--ink-muted);margin:0 0 12px;}
  .msg{color:var(--amber-800);font-size:13px;min-height:20px;}
  .ticket{position:relative;background:var(--card);border-radius:18px;box-shadow:0 2px 14px rgba(0,0,0,0.07);}
  .t-head{background:var(--green-600);color:#fff;border-radius:18px 18px 0 0;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.08em;}
  .t-head svg{width:20px;height:20px;stroke:#fff;}
  .t-body{padding:18px 18px 16px;}
  .route{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .route b{font-size:20px;display:block;}
  .route svg{width:26px;height:26px;}
  .meta{display:flex;gap:16px;flex-wrap:wrap;}
  .meta b{font-size:14px;display:block;font-weight:600;word-break:break-all;}
  .perf{position:relative;border-top:2px dashed var(--border);margin:0 14px;}
  .perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--cream);}
  .perf::before{left:-24px;} .perf::after{right:-24px;}
  .t-stub{padding:16px 18px 18px;}
  .gate-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:12px 14px;}
  .gate-row.done{background:var(--green-50);border-color:var(--green-100);}
  .gate-no{background:var(--amber-50);color:var(--amber-800);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:600;text-align:center;line-height:1.2;flex-shrink:0;}
  .gate-row.done .gate-no{background:var(--green-100);color:var(--green-800);}
  .gate-main{flex:1;}
  .gate-main b{font-size:15px;display:block;}
  .gate-main span{font-size:12px;color:var(--ink-muted);}
  .stamp{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink-muted);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-muted);flex-shrink:0;transform:rotate(-10deg);}
  .gate-row.done .stamp{border-color:var(--green-600);color:var(--green-600);font-weight:700;}
  .slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:16px 0 6px;}
  .slot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:#F1EFE8;color:var(--ink-muted);font-size:11px;text-align:center;}
  .slot svg{width:20px;height:20px;}
  .slot.unlocked{background:var(--green-50);color:var(--green-800);animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(.85);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
  .barcode{height:34px;margin-top:14px;border-radius:4px;opacity:.55;background:repeating-linear-gradient(90deg,#2C2C2A 0 2px,transparent 2px 5px,#2C2C2A 5px 6px,transparent 6px 10px,#2C2C2A 10px 13px,transparent 13px 15px);}
  .progress-text{font-size:13px;color:var(--ink-soft);margin:4px 0 12px;}
  .gate-badge{display:inline-block;background:var(--amber-50);color:var(--amber-800);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:600;margin-bottom:10px;}
  h1{font-size:20px;margin:0 0 10px;}
  .task{font-size:18px;margin:10px 0 14px;}
  .tip{background:var(--amber-50);color:var(--amber-800);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;}
  .mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0;}
  .mood-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;font-size:12px;}
  .mood-btn svg{width:28px;height:28px;}
  .unlock-card{background:var(--green-50);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .unlock-card b{display:flex;align-items:center;gap:6px;color:var(--green-800);font-size:15px;margin-bottom:4px;}
  .unlock-card b svg{width:18px;height:18px;flex-shrink:0;}
  .unlock-card p{margin:0;font-size:14px;color:var(--ink-soft);}
  .pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px;}
  .pick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;}
  .pick-btn svg{width:26px;height:26px;}
  .pick-btn span{font-size:13px;}
  .voice{font-size:16px;margin-bottom:12px;}
  .passno{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;letter-spacing:.12em;font-weight:700;color:var(--green-800);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .chip{background:var(--green-50);color:var(--green-800);border-radius:999px;padding:3px 10px;font-size:12px;}
  .claim{margin-top:14px;padding:14px;border-radius:12px;background:var(--amber-50);color:var(--amber-800);font-size:14px;text-align:center;}
  .redeemed{margin-top:14px;padding:14px;border-radius:12px;border:2px solid var(--green-600);color:var(--green-800);text-align:center;font-weight:600;}
  .cover{text-align:center;margin:6px 0 20px;}
  .cover-hosp{font-size:28px;font-weight:700;color:var(--green-800);letter-spacing:.12em;}
  .cover-sub{font-size:14px;color:var(--ink-soft);letter-spacing:.18em;margin-top:2px;}
  .cover-title{display:inline-block;margin-top:12px;background:var(--green-600);color:#fff;border-radius:999px;padding:4px 16px;font-size:13px;letter-spacing:.08em;}
  .wish{font-size:14px;margin:10px 0 0;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="screen"><div id="game"></div></div>

<script>
const STAFF_PIN='1022'; // 工作人員確認碼,可自行修改(4位數字)

const ICON_NPC='<svg viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke-linecap="round"/></svg>';
const ICON_SMILE='<svg viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 13c1 1.5 2.5 2.3 4 2.3s3-.8 4-2.3" stroke-linecap="round"/><circle cx="9" cy="10" r="1" fill="#3B6D11"/><circle cx="15" cy="10" r="1" fill="#3B6D11"/></svg>';
const ICON_TIRED='<svg viewBox="0 0 24 24" fill="none" stroke="#5F5E5A" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 16c1-1.2 2.5-1.8 4-1.8s3 .6 4 1.8" stroke-linecap="round"/><path d="M7.5 10.5l3 1M16.5 10.5l-3 1" stroke-linecap="round"/></svg>';
const ICON_LEAF='<svg viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="1.6"><path d="M5 19c8 0 14-6 14-14-8 0-14 6-14 14z" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19c3-3 6-6 9-9" stroke-linecap="round"/></svg>';
const ICON_LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke-linecap="round"/></svg>';
const ICON_PLANE='<svg viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-linejoin="round"><path d="M21 3L3 10.5l6.5 2.5L12 20l2.5-5.5L21 3z"/></svg>';
const FALLBACK={npc:ICON_NPC,smile:ICON_SMILE,tired:ICON_TIRED};
const PORTRAIT={greeting:'axia-greeting.png',happy:'axia-happy.png',peaceful:'axia-peaceful.png'};
function handleImgError(imgEl,key){
  const div=document.createElement('div');
  div.innerHTML=FALLBACK[key];
  div.style.cssText='width:100%;height:100%;display:flex;align-items:center;justify-content:center;';
  imgEl.replaceWith(div);
}
function portraitImg(key,fb){return `<img src="${PORTRAIT[key]}" alt="阿霞" onerror="handleImgError(this,'${fb}')">`;}
function face(level){
  const m={5:'M7.5 13.5c1 2.2 2.7 3.2 4.5 3.2s3.5-1 4.5-3.2',4:'M8 14c1 1.4 2.4 2.1 4 2.1s3-.7 4-2.1',3:'M8.5 15.5h7',2:'M8 16.5c1-1.3 2.4-2 4-2s3 .7 4 2',1:'M7.5 17c1-2 2.7-3 4.5-3s3.5 1 4.5 3'};
  return `<svg viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="#3B6D11"/><circle cx="15" cy="10" r="1" fill="#3B6D11"/><path d="${m[level]}" stroke-linecap="round"/></svg>`;
}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function fmt(iso){const d=new Date(iso);return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}

// 六力(對齊ICOPE官方六大面向)
const ABILITIES=['認知功能','行動能力','營養','視力','聽力','情緒'];
const POWERS=[
  {key:'認知功能',label:'防失智,腦袋動一動'},
  {key:'行動能力',label:'存肌力,腿腳更勇健'},
  {key:'營養',label:'顧肚子,才有力氣顧自己'},
  {key:'情緒',label:'心事別悶著,找人虧一下'},
  {key:'視力',label:'顧眼睛,才看得到孫子的可愛'},
  {key:'聽力',label:'耳朵靈,才聽得到好康的'}
];
const GATES=[
 {id:'punch',no:1,name:'揮拳登機門',task:'戴上拳擊手套,揮出 20 拳!',
  tip:'量力而為,累了就休息。完成後,請工作人員協助蓋章。',abilities:['行動能力'],
  msgs:{'行動能力':'20 拳完成!日常保持活動,有助於維持肌力與行動能力。累了就休息,不需要勉強自己。'}},
 {id:'ball',no:2,name:'營養餐盒登機門',task:'聽工作人員說明今天要裝的份數,用高齡友善餐具,把乒乓球夾進餐盒裡!',
  tip:'餐盒有魚類、水果類、蔬菜類和主食,依每日所需份數裝,一份對應幾顆乒乓球請看現場說明。完成後,請工作人員協助蓋章。',abilities:['營養','視力','聽力'],
  msgs:{'營養':'餐盒裝好了!每天吃到不同種類、足夠份數的食物,有助於維持肌肉與體力。',
        '視力':'看清楚餐盒和乒乓球才夾得準!如果最近看手機或報紙越來越吃力,別只當作年紀大了,安排檢查才知道原因。',
        '聽力':'聽清楚份數才不會裝錯!如果常常聽不清楚、聽錯,或電視越開越大,就值得留意並接受檢查。'}},
 {id:'find',no:3,name:'尋找小阿霞登機門',task:'在展館裡,找出藏起來的小阿霞!',
  tip:'線索請向工作人員領取。找到後,請工作人員協助蓋章。',abilities:['認知功能'],
  msgs:{'認知功能':'找到小阿霞了!觀察、記憶和尋找,都是在動腦。偶爾給腦袋新挑戰,例如學手機、玩桌遊或學新菜色,都能讓大腦接觸更多不同刺激。'}},
 {id:'mood',no:4,name:'心情登機門',task:'此時此刻,你的心情像哪一個?',abilities:['情緒'],inweb:true}
];
const MOOD_LABELS={5:'超好',4:'不錯',3:'普通',2:'有點悶',1:'不太好'};
const MOOD_MSG={
 5:'太好了!帶著好心情繼續逛,心情也是很重要的存款。',
 4:'心情不錯,真好!繼續把這份好心情存起來。',
 3:'平平穩穩也很好。在展場多逛逛、找人聊聊,心情說不定會更亮一點。',
 2:'謝謝你告訴阿霞。心情有點悶的時候,不用自己撐著,找人聊聊會舒服一些。',
 1:'謝謝你誠實告訴阿霞。心情不太好的時候,不用一個人撐著,現場的護理師很樂意陪你聊聊。'
};

// 狀態(只存在這支手機的瀏覽器裡)
const KEY='icope_state_v2';
const blank=()=>({name:'',done:[],chosen:null,no:null,doneAt:null,redeemedAt:null});
let S=blank(), stage='intro', currentGate=null, lastMoodMsg='';
function load(){try{const v=localStorage.getItem(KEY);if(v)S=Object.assign(blank(),JSON.parse(v));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const g=()=>document.getElementById('game');
const isDone=id=>S.done.includes(id);
function unlocked(){const s=new Set();GATES.forEach(x=>{if(isDone(x.id))x.abilities.forEach(a=>s.add(a));});return s;}
function gateById(id){return GATES.find(x=>x.id===id);}
function genNo(){return ('A'+Math.random().toString(36).slice(2,6)+Date.now().toString(36).slice(-3)).toUpperCase();}

function render(){
  if(stage==='intro'){
    g().innerHTML=`
    <div class="cover"><div class="cover-hosp">安南醫院</div><div class="cover-sub">社區醫學 . 社區護理</div><div class="cover-title">咱後世人 . 六力登機證</div></div>
    <div class="hello"><div class="avatar">${portraitImg('greeting','npc')}</div>
      <p>歡迎登機!請先填寫旅客姓名,阿霞幫你辦理登機證。</p></div>
    <div class="card">
      <label for="nm">旅客姓名</label>
      <input class="text" id="nm" maxlength="10" placeholder="請輸入姓名" autocomplete="off">
      <p class="note">姓名只會存在這支手機裡,領取禮物時給工作人員核對。</p>
      <div class="msg" id="nm-msg"></div>
      <button class="btn-primary" onclick="startPass()">開始辦理登機</button>
    </div>`;
    return;
  }
  if(stage==='ticket'){
    const un=unlocked(), n=S.done.length, all=n===GATES.length;
    g().innerHTML=`
    <div class="hello"><div class="avatar">${portraitImg('greeting','npc')}</div>
      <p>${esc(S.name)},歡迎登機!跟著阿霞到四個登機門蓋章,把六種能力一個個存起來。</p></div>
    <div class="ticket">
      <div class="t-head"><span>BOARDING PASS . 登機證</span>${ICON_PLANE}</div>
      <div class="t-body">
        <div class="route"><div><small>FROM</small><b>安南醫院</b></div>${ICON_PLANE}<div style="text-align:right;"><small>TO</small><b>未來的我</b></div></div>
        <div class="meta"><div><small>旅客</small><b>${esc(S.name)}</b></div><div><small>航班</small><b>咱後世人 6F</b></div><div><small>日期</small><b>10/22-24</b></div></div>
      </div>
      <div class="perf"></div>
      <div class="t-stub">
        <div class="progress-text">登機門蓋章 ${n}/${GATES.length}</div>
        ${GATES.map(x=>`<button class="gate-row ${isDone(x.id)?'done':''}" onclick="openGate('${x.id}')">
          <div class="gate-no">登機門<br>${x.no}</div>
          <div class="gate-main"><b>${x.name}</b><span>${x.abilities.join('、')}</span></div>
          <div class="stamp">${isDone(x.id)?'已蓋章':'前往'}</div></button>`).join('')}
        <div class="slots">${ABILITIES.map(a=>`<div class="slot ${un.has(a)?'unlocked':''}">${un.has(a)?ICON_LEAF:ICON_LOCK}<span>${a}</span></div>`).join('')}</div>
        ${all?`<button class="btn-primary" style="margin-top:14px;" onclick="stage='pick';render();">完成登機,領取今天的禮物</button>`:''}
        <div class="barcode" aria-hidden="true"></div>
      </div>
    </div>`;
    return;
  }
  if(stage==='gate'){
    const x=gateById(currentGate);
    if(x.inweb){
      g().innerHTML=`<div class="card">
        <button class="btn-back" onclick="stage='ticket';render();">← 回登機證</button>
        <div class="gate-badge">登機門 ${x.no}</div>
        <h1>${x.name}</h1>
        <div class="task">${x.task}</div>
        <div class="mood-grid">${[5,4,3,2,1].map(l=>`<button class="mood-btn" onclick="pickMood(${l})">${face(l)}<span>${MOOD_LABELS[l]}</span></button>`).join('')}</div>
      </div>`;
    } else {
      g().innerHTML=`<div class="card">
        <button class="btn-back" onclick="stage='ticket';render();">← 回登機證</button>
        <div class="gate-badge">登機門 ${x.no}</div>
        <h1>${x.name}</h1>
        <div class="task">${x.task}</div>
        <div class="tip">${x.tip}</div>
        ${isDone(x.id)?'<p style="color:var(--green-600);font-size:14px;">這個登機門已經蓋章囉!</p>':`<div id="staff-area"><button class="btn-primary" onclick="showPin('staff-area','stamp')">請工作人員確認完成</button></div>`}
      </div>`;
    }
    return;
  }
  if(stage==='stamped'){
    const x=gateById(currentGate), all=S.done.length===GATES.length;
    const cards=x.inweb
      ? `<div class="unlock-card"><b>${ICON_LEAF}情緒</b><p>${lastMoodMsg}</p></div>`
      : x.abilities.map(a=>`<div class="unlock-card"><b>${ICON_LEAF}${a}</b><p>${x.msgs[a]}</p></div>`).join('');
    g().innerHTML=`<div class="card">
      <div class="portrait">${portraitImg('happy','smile')}</div>
      <h1 style="text-align:center;">登機門 ${x.no} 通過!</h1>
      <p class="voice" style="text-align:center;color:var(--ink-soft);">解鎖了 ${x.abilities.join('、')}</p>
      ${cards}
      <button class="btn-primary" style="margin-top:12px;" onclick="stage='ticket';render();">${all?'回到登機證,準備完成登機':'回到登機證'}</button>
    </div>`;
    return;
  }
  if(stage==='pick'){
    g().innerHTML=`<div class="card">
      <div class="portrait">${portraitImg('happy','smile')}</div>
      <h1 style="text-align:center;">六力都解鎖了!</h1>
      <p class="voice" style="text-align:center;">今天,你最想幫未來的自己多存哪一力?</p>
      <div class="pick-grid">${POWERS.map(o=>`<button class="pick-btn" onclick="pickPower('${o.key}')">${ICON_LEAF}<span>${o.label}</span></button>`).join('')}</div>
    </div>`;
    return;
  }
  if(stage==='final'){
    const pw=POWERS.find(o=>o.key===S.chosen);
    const un=unlocked();
    g().innerHTML=`
    <div class="portrait">${portraitImg('peaceful','smile')}</div>
    <p class="voice" style="text-align:center;">${esc(S.name)},登機完成!記住你今天最想存的這一件,這是送給未來自己的禮物。</p>
    <div class="ticket">
      <div class="t-head"><span>BOARDING PASS . 登機證</span>${ICON_PLANE}</div>
      <div class="t-body">
        <div class="route"><div><small>FROM</small><b>安南醫院</b></div>${ICON_PLANE}<div style="text-align:right;"><small>TO</small><b>未來的我</b></div></div>
        <div class="meta"><div><small>旅客</small><b>${esc(S.name)}</b></div><div><small>航班</small><b>咱後世人 6F</b></div><div><small>完成時間</small><b>${fmt(S.doneAt)}</b></div></div>
      </div>
      <div class="perf"></div>
      <div class="t-stub">
        <small>登機證編號</small>
        <div class="passno">${esc(S.no)}</div>
        <div class="chips">${GATES.map(x=>`<span class="chip">登機門${x.no} 已蓋章</span>`).join('')}</div>
        <div class="slots">${ABILITIES.map(a=>`<div class="slot ${un.has(a)?'unlocked':''}">${un.has(a)?ICON_LEAF:ICON_LOCK}<span>${a}</span></div>`).join('')}</div>
        <div class="wish">今天最想存:<b>${pw?pw.label:''}</b></div>
        <div class="barcode" aria-hidden="true"></div>
        ${S.redeemedAt
          ?`<div class="redeemed">禮物已兌換 . ${fmt(S.redeemedAt)}</div>`
          :`<div class="claim">請出示這張登機證給工作人員,領取禮物</div>
            <div id="redeem-area" style="margin-top:10px;"><button class="btn-primary" onclick="showPin('redeem-area','redeem')">工作人員兌換禮物</button></div>`}
      </div>
    </div>
    <div id="reset-area" style="margin-top:14px;"><button class="btn-link" onclick="showPin('reset-area','reset')">工作人員:重置這張登機證</button></div>`;
  }
}

function startPass(){
  const v=document.getElementById('nm').value.trim();
  if(!v){document.getElementById('nm-msg').textContent='請先輸入旅客姓名';return;}
  S.name=v;save();stage='ticket';render();
}
function openGate(id){currentGate=id;stage='gate';render();}
function stampGate(id){if(!isDone(id))S.done.push(id);save();currentGate=id;stage='stamped';render();}
function pickMood(l){lastMoodMsg=MOOD_MSG[l];stampGate('mood');}
function pickPower(k){S.chosen=k;S.no=genNo();S.doneAt=new Date().toISOString();save();stage='final';render();}

function showPin(area,action){
  document.getElementById(area).innerHTML=`<p style="font-size:13px;color:var(--ink-soft);margin:0 0 8px;">工作人員請輸入確認碼</p>
  <input class="text" id="pin" type="password" inputmode="numeric" maxlength="4" style="text-align:center;letter-spacing:.3em;">
  <div class="msg" id="pin-msg"></div>
  <button class="btn-primary" onclick="checkPin('${action}')">確認</button>`;
  document.getElementById('pin').focus();
}
function checkPin(action){
  const v=document.getElementById('pin').value;
  if(v!==STAFF_PIN){document.getElementById('pin-msg').textContent='確認碼不對,請再試一次';document.getElementById('pin').value='';return;}
  if(action==='stamp'){stampGate(currentGate);}
  else if(action==='redeem'){S.redeemedAt=new Date().toISOString();save();render();}
  else if(action==='reset'){S=blank();try{localStorage.removeItem(KEY);}catch(e){}stage='intro';render();}
}

load();
stage=!S.name?'intro':(S.no?'final':'ticket');
render();
</script>
</body>
</html>
