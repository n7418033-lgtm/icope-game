<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>咱後世人 . ICOPE六力小旅程</title>
<style>
  :root{
    --green-50:#EAF3DE; --green-200:#97C459; --green-600:#3B6D11; --green-800:#27500A; --green-900:#173404;
    --amber-50:#FAEEDA; --amber-200:#EF9F27; --amber-600:#854F0B; --amber-800:#633806;
    --cream:#FBF8F1; --card:#FFFFFF; --ink:#2C2C2A; --ink-soft:#5F5E5A; --ink-muted:#888780; --border:#E4E0D4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.7;}
  .screen{max-width:520px;margin:0 auto;padding:24px 20px 60px;min-height:100vh;}
  .card{background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
  h1{font-size:18px;font-weight:600;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--ink-muted);margin:0 0 20px;}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--green-50);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .fate-portrait{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;overflow:hidden;background:var(--green-50);display:flex;align-items:center;justify-content:center;}
  .fate-portrait img{width:100%;height:100%;object-fit:cover;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .npcname{font-size:16px;font-weight:600;}
  .npcrole{font-size:12px;color:var(--ink-muted);}
  .voice{font-size:17px;margin-bottom:28px;}
  button{font-family:inherit;cursor:pointer;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:15px;padding:16px 18px;transition:background .15s;}
  button:disabled{opacity:.5;cursor:default;}
  .btn-primary{width:100%;background:var(--green-600);color:#fff;border:none;font-weight:500;padding:16px;}
  .btn-primary:active{background:var(--green-800);}
  .choice{display:block;width:100%;text-align:left;margin-bottom:12px;}
  .choice:active{background:var(--green-50);}
  .progress{display:flex;gap:4px;margin-bottom:22px;}
  .progress div{flex:1;height:5px;border-radius:3px;background:var(--border);}
  .progress div.done{background:var(--green-200);}
  .reveal{background:var(--green-50);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--green-800);margin:16px 0;}
  .mood-row{display:flex;gap:10px;}
  .mood-btn{flex:1;padding:20px 0;text-align:center;}
  .mood-btn svg{width:28px;height:28px;}
  .fate-scene{background:var(--green-50);border-radius:16px;padding:28px 20px;text-align:center;margin:16px 0 20px;}
  .fate-title{font-size:19px;font-weight:600;color:var(--green-800);margin-bottom:14px;}
  .fate-quote{font-size:16px;color:var(--ink-soft);}
  .bars{display:grid;gap:10px;margin:18px 0 24px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-label{width:64px;font-size:13px;color:var(--ink-soft);flex-shrink:0;}
  .bar-track{flex:1;height:9px;background:var(--border);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .redirect{background:var(--amber-50);color:var(--amber-800);border-radius:12px;padding:14px;font-size:14px;text-align:center;margin-bottom:16px;}
</style>
</head>
<body>
<div class="screen"><div id="game"></div></div>

<script>
const ICON_NPC='<svg viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke-linecap="round"/></svg>';

// 阿霞插畫圖檔:把對應圖片放進跟這個網頁同一個資料夾,檔名要一致,圖片就會自動顯示。
// 圖片還沒準備好時,會自動顯示簡易備用圖示,不會壞版面。
const PORTRAIT={
  greeting:'axia-greeting.png',   // 開場:親切問候(揮手)
  worried:'axia-worried.png',     // 亞健康警示結局:有點擔心
  happy:'axia-happy.png',         // 活躍老化結局:開心與驕傲
  peaceful:'axia-peaceful.png'    // 陪伴照護結局:平靜與微笑
};
function portraitImg(key,fallbackIcon){
  return `<img src="${PORTRAIT[key]}" alt="阿霞" onerror="this.replaceWith(Object.assign(document.createElement('div'),{innerHTML:'${fallbackIcon.replace(/'/g,"\\'")}',style:'width:100%;height:100%;display:flex;align-items:center;justify-content:center;'}))">`;
}
const ICON_SMILE='<svg viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 13c1 1.5 2.5 2.3 4 2.3s3-.8 4-2.3" stroke-linecap="round"/><circle cx="9" cy="10" r="1" fill="#3B6D11"/><circle cx="15" cy="10" r="1" fill="#3B6D11"/></svg>';
const ICON_NEUTRAL='<svg viewBox="0 0 24 24" fill="none" stroke="#854F0B" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 14.5h8" stroke-linecap="round"/><circle cx="9" cy="10" r="1" fill="#854F0B"/><circle cx="15" cy="10" r="1" fill="#854F0B"/></svg>';
const ICON_TIRED='<svg viewBox="0 0 24 24" fill="none" stroke="#5F5E5A" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 16c1-1.2 2.5-1.8 4-1.8s3 .6 4 1.8" stroke-linecap="round"/><path d="M7.5 10.5l3 1M16.5 10.5l-3 1" stroke-linecap="round"/></svg>';

const base=[
{domain:'認知',a:'兒子教你用手機看新聞',b:'照平常習慣看報紙',ra:'學新事物能刺激大腦保持靈活,不過今天覺得有點挫折',rb:'用熟悉的方式很輕鬆,但長期缺乏新刺激,大腦活躍度會慢慢下降',healthy:'a'},
{domain:'行動',a:'今天下午去公園走走',b:'今天下午在家看電視休息',ra:'保持活動量有助維持肌力,不過今天回家覺得有點累',rb:'今天過得很輕鬆,但久坐習慣長期下來會加速肌力流失',healthy:'a'},
{domain:'營養',a:'今天午餐吃滷肉飯配滷蛋',b:'今天午餐吃清粥配醬菜',ra:'蛋白質攝取足夠有助維持肌肉量,不過今天吃得比較油膩',rb:'吃得清爽舒服,但長期蛋白質不足會提高肌少症風險',healthy:'a'},
{domain:'情緒',a:'心情不好時打電話找朋友聊聊',b:'心情不好時自己一個人靜一靜',ra:'找人聊聊能抒發情緒,不過講完覺得有點累',rb:'一個人靜一靜比較不費力,但長期悶著容易累積壓力',healthy:'a'},
{domain:'社會參與',a:'去社區據點跟大家一起包水餃',b:'自己在家包水餃比較安靜',ra:'跟大家互動很開心,不過人多的時候有點吵',rb:'自己在家很自在,但長期減少社會互動是早期警訊',healthy:'a'},
{domain:'記憶',a:'跟女兒說「我最近常忘東西」',b:'自己再找找看,不特別提',ra:'說出來能及早釐清狀況,不過怕家人擔心',rb:'自己處理比較不麻煩,但可能延誤就醫時機',healthy:'a'}
];
const tired=[
{domain:'認知',a:'今天有點累,但還是滑手機看看新聞',b:'今天有點累,乾脆什麼都不看,好好放空',ra:'累的時候還願意動動腦,對認知有幫助,不過真的別勉強太久',rb:'放空休息也是身體需要的,但如果常常這樣,腦袋刺激會變少',healthy:'a'},
{domain:'行動',a:'今天特別累,去附近坐著曬曬太陽',b:'今天特別累,在家躺著休息',ra:'曬點太陽走走,身體還是有動到,今天雖累但明天會輕鬆一點',rb:'好好休息也很重要,但連續幾天都這樣,肌力會慢慢流失',healthy:'a'},
{domain:'營養',a:'雖然沒胃口,還是勉強吃了顆蛋補充蛋白質',b:'沒胃口,今天就喝點清湯應付一餐',ra:'再累也顧到營養,對維持肌肉量很重要',rb:'沒胃口是正常的,但長期蛋白質攝取不足會影響體力恢復',healthy:'a'},
{domain:'情緒',a:'雖然累,還是打了通電話跟朋友說今天不舒服',b:'累到沒力氣多說,自己躺著就好',ra:'說出來讓人知道你今天不舒服,朋友也能多關心你',rb:'自己休息也沒關係,但如果常常悶著不說,身邊的人反而不知道怎麼幫你',healthy:'a'},
{domain:'社會參與',a:'雖然累,還是去據點露個臉,跟大家說一聲不舒服',b:'今天太累,決定不去據點,在家休息',ra:'去露個面讓大家知道你的狀況,也是一種連結',rb:'累的時候休息很正常,但長期都不去,可能會漸漸跟大家疏遠',healthy:'a'},
{domain:'記憶',a:'雖然很累,還是趁現在記下明天的回診時間',b:'太累了,想說之後再記就好',ra:'趁腦袋還清楚時記下來,能避免忘記重要的事',rb:'累的時候想晚點再說很正常,但拖著容易忘記重要的回診時間',healthy:'a'}
];

let stage='intro',i=0,score=0,picks=[],rounds=base;
const g=()=>document.getElementById('game');

function render(){
  if(stage==='intro'){
    g().innerHTML=`<div class="card">
      <div class="row"><div class="avatar">${portraitImg('greeting',ICON_NPC)}</div><div><div class="npcname">阿霞</div><div class="npcrole">你今天的旅伴</div></div></div>
      <div class="voice">你好,咱鬥陣來看看,要怎樣顧予家己勇勇的。</div>
      <button class="btn-primary" onclick="stage='mood';render();">開始</button>
    </div>`;
    return;
  }
  if(stage==='mood'){
    g().innerHTML=`<div class="card">
      <h1>不用想,憑感覺選就好</h1>
      <p class="sub">今天心情比較像?</p>
      <div class="mood-row">
        <button class="mood-btn" onclick="setMood('good')">${ICON_SMILE}</button>
        <button class="mood-btn" onclick="setMood('mid')">${ICON_NEUTRAL}</button>
        <button class="mood-btn" onclick="setMood('tired')">${ICON_TIRED}</button>
      </div>
    </div>`;
    return;
  }
  if(stage==='play'){
    const r=rounds[i];
    g().innerHTML=`<div class="card">
      <p class="sub">阿霞問你 . ${r.domain} . ${i+1}/${rounds.length}</p>
      <div class="progress">${rounds.map((_,idx)=>`<div class="${idx<i?'done':''}"></div>`).join('')}</div>
      <div id="choices">
        <button class="choice" onclick="choose('a')">${r.a}</button>
        <button class="choice" onclick="choose('b')">${r.b}</button>
      </div>
      <div id="reveal"></div>
    </div>`;
    return;
  }
  if(stage==='end'){
    const pct=score/rounds.length;
    let title,scene,quote,pkey,pfallback;
    if(pct>=0.75){title='活躍老化';scene='阿霞跟朋友在高齡運動會上舉手歡呼,笑容燦爛';quote='你陪阿霞選出了健康的未來';pkey='happy';pfallback=ICON_SMILE;}
    else if(pct>=0.4){title='亞健康警示';scene='阿霞站在鏡子前,若有所思,但眼神裡有一絲希望';quote='有些選擇還可以再調整,現在開始還來得及';pkey='worried';pfallback=ICON_NEUTRAL;}
    else {title='陪伴照護';scene='志工輕握阿霞的手,兩人相視而笑,平靜而安心';quote='就算走到這一步,咱後世人也會鬥陣顧';pkey='peaceful';pfallback=ICON_TIRED;}
    const domains=rounds.map((r,idx)=>({name:r.domain,ok:picks[idx]===r.healthy}));
    const weak=domains.filter(d=>!d.ok).map(d=>d.name);
    let redirect='歡迎繼續體驗現場其他攤位';
    if(weak.includes('行動')||weak.includes('營養'))redirect='推薦體驗 . BGYM器材體驗 + 肌少症檢測';
    else if(weak.includes('記憶'))redirect='推薦體驗 . 失智十大警訊大富翁';
    g().innerHTML=`<div class="card">
      <p class="sub" style="text-align:center;">阿霞的未來揭曉</p>
      <div class="fate-scene">
        <div class="fate-portrait">${portraitImg(pkey,pfallback)}</div>
        <div class="fate-title">${title}</div>
        <p style="color:var(--ink-soft);font-size:14px;margin-bottom:14px;">${scene}</p>
        <div class="fate-quote">${quote}</div>
      </div>
      <p class="sub">六力總結</p>
      <div class="bars">${domains.map(d=>`
        <div class="bar-row">
          <div class="bar-label">${d.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${d.ok?100:40}%;background:${d.ok?'var(--green-200)':'var(--amber-200)'};"></div></div>
        </div>`).join('')}
      </div>
      <div class="redirect">${redirect}</div>
      <button class="btn-primary" onclick="stage='intro';i=0;score=0;picks=[];render();">再玩一次</button>
    </div>`;
  }
}
function setMood(m){rounds=m==='tired'?tired:base;stage='play';i=0;render();}
function choose(c){
  const r=rounds[i];picks.push(c);if(c===r.healthy)score++;
  document.getElementById('reveal').innerHTML=`<div class="reveal">${c==='a'?r.ra:r.rb}</div>
  <button class="btn-primary" onclick="i++;stage=(i<rounds.length)?'play':'end';render();">${i+1<rounds.length?'下一關':'看結果'}</button>`;
  document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);
}
render();
</script>
</body>
</html>
